name: ci
on:
  pull_request:
  push:
    branches: [main]
    # A markdown-only push (notes, logs) runs no suite; code and generated files still do.
    paths-ignore: ['**.md']
# A newer push to the same ref cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Least privilege: no job writes to the repository.
permissions:
  contents: read
jobs:
  static:
    # W10: the source-tree ratchets (tests/test_*ratchet*.py + the event-kind
    # contract) read files and parse ASTs; they need no extras, no browser and no
    # xdist (one process shares tests/support/repo_index.py's parse cache).
    # test_effect_classification_ratchet imports the twitter pack, so it runs in
    # the `rest` shard below instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install -e ".[dev]"
      # STATIC: the same one-liner names the set in the `test` job, which skips it.
      - run: |
          STATIC="$(ls tests/test_*ratchet*.py | grep -v test_effect_classification_ratchet) tests/test_event_kind_contract.py"
          pytest -q -p no:cacheprovider --timeout=600 $STATIC
  test:
    # W10: the suite in five shards, each in parallel (pytest-xdist, one worker
    # per CPU, a whole file per worker so module fixtures stay together). The
    # `rest` shard is everything the other shards and `static` do not name, so a
    # new test directory can never fall outside CI. `slow` = the modules that
    # spawn a process/browser/container (tests/conftest.py marks them by rule);
    # the other shards skip them.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [core, tools, agents, rest, slow]
    steps:
      # The [all] extras (torch-sized wheels) overflow the runner's free disk
      # ("No space left on device"); drop the preinstalled SDKs the suite never uses.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml }
      # The suite imports the full package (browser/server/etc.) at collection
      # time and uses pytest-asyncio, so install the documented dev setup
      # (README "Contributing": pip install -e ".[dev,all]"). A bare
      # `pip install -e .` fails collection on missing playwright/fastapi.
      # 067 (one install): the first-party packs ship inside polyrob — the
      # editable install provides them; [all] carries their SDK extras.
      - run: pip install -e ".[dev,all]"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.lock') }}
      # The browser tests launch real headless chromium via playwright.
      - run: python -m playwright install --with-deps chromium
      - name: pytest (${{ matrix.shard }})
        env: { SHARD: "${{ matrix.shard }}" }
        run: |
          # STATIC: the same one-liner as the `static` job, which runs this set.
          STATIC="$(ls tests/test_*ratchet*.py | grep -v test_effect_classification_ratchet) tests/test_event_kind_contract.py"
          OWN="tests/unit/core tests/unit/tools tests/unit/modules tests/unit/agents tests/unit/surfaces tests/unit/cli"
          ign() { for p in "$@"; do printf -- '--ignore=%s ' "$p"; done; }
          # Everything outside the named shards and the static job; ops/tests
          # exists only in the private tree.
          REST="tests $( [ -d ops/tests ] && echo ops/tests ) $(ign $STATIC)"
          case "$SHARD" in
            core)   ARGS="tests/unit/core" ;;
            tools)  ARGS="tests/unit/tools tests/unit/modules" ;;
            agents) ARGS="tests/unit/agents tests/unit/surfaces tests/unit/cli" ;;
            rest)   ARGS="$REST $(ign $OWN)" ;;
            slow)   ARGS="$REST" ;;
          esac
          if [ "$SHARD" = slow ]; then MARK="slow"; else MARK="not slow"; fi
          pytest -q -p no:cacheprovider -n auto --dist loadfile --timeout=600 -m "$MARK" $ARGS
  base-install:
    # The `test` job installs [dev,all], so it can never catch a dependency that
    # moved to an extra but is still imported on the default agent path. This one
    # installs EXACTLY what `pip install polyrob` gives a new user. 058 T0.1.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - run: pip install -e .
      - name: the default agent path imports with no extras
        env: { POLYROB_DATA_DIR: /tmp/polyrob-ci }
        run: |
          python - <<'PY'
          # build_cli_container is async (polyrob/app/bootstrap.py) — IMPORTED, not called:
          # running it needs a data home, a provider key and a loop, none of which
          # belong in an import smoke test.
          from polyrob.app.bootstrap import build_cli_container
          from agents.task.constants import BASE_DEFAULT_TOOLS
          from modules.memory.task import TaskContextManager
          from tools.filesystem import FileSystem
          from modules.llm.llm_factory import create_chat_model
          # the 058 surfaces whose dependency moved to an extra: each must IMPORT
          # bare and refuse with the extra named, never traceback
          import tools.document_parser, tools.filesystem_pdf, modules.cards.cards
          import agents.task.gif_utils, core.optional_extras, cli.update.extras
          from core.lazy_deps import remedy
          assert "polyrob[docs]" in remedy("docs.pdf")
          print("base import OK:", BASE_DEFAULT_TOOLS)
          PY
      - name: a bare install still runs a CLI verb
        env: { POLYROB_DATA_DIR: /tmp/polyrob-ci }
        run: python -m cli.polyrob doctor --flags --search MEMORY_BACKEND
      - name: every core module imports with no extras; the packs name their extras (067)
        env: { POLYROB_DATA_DIR: /tmp/polyrob-ci }
        run: |
          python - <<'PY'
          # The lean-core proof: every core module imports bare, and the
          # first-party packs (shipped inside polyrob, 067 one install) load with
          # their SDK extras named, never a traceback. W11: nothing here is a hand
          # list — NEEDS_EXTRA is DERIVED from the modules' unguarded module-level
          # imports (tests/install/needs_extra.py over core.optional_extras), the
          # first-party packs from pyproject's polyrob.packs entry points, and the
          # packs that must name an extra from their pack.toml tool `requires`.
          import importlib, pkgutil, tomllib
          from importlib.metadata import entry_points
          import core
          from tests.install.needs_extra import modules_needing_extras
          # Phase 1 BEFORE the walk: importing polyrob.app.bootstrap builds the capability
          # views, and a pack row registered after that is refused (067 P2).
          from core.packs.loader import load_packs, register_policies
          register_policies()
          eps = {e.name: e.dist.metadata["Name"] for e in entry_points(group="polyrob.packs")}
          declared = tomllib.load(open("pyproject.toml", "rb"))["project"]["entry-points"]["polyrob.packs"]
          assert eps == {p: "polyrob" for p in declared}, eps
          NEEDS_EXTRA = set(modules_needing_extras("."))
          bad, stale = {}, set(NEEDS_EXTRA)
          for m in pkgutil.walk_packages(core.__path__, "core."):
              try:
                  importlib.import_module(m.name)
              except ImportError as exc:
                  if m.name not in NEEDS_EXTRA:
                      bad[m.name] = str(exc)
                  stale.discard(m.name)
          assert not bad, bad
          assert not stale, f"imports bare now, but the derivation says it needs an extra: {sorted(stale)}"
          from core.packs import state
          load_packs()
          assert not state.discovery_error(), state.discovery_error()
          recs = {r.id: r for r in state.records()}
          assert set(recs) == set(eps) and all(r.status == state.LOADED for r in recs.values()), \
              [r.line() for r in recs.values()]
          sdk_packs = [r for r in recs.values() if any(t.requires for t in r.manifest.tools)]
          assert sdk_packs, "no first-party pack declares an SDK requirement"
          for r in sdk_packs:
              assert r.needs and f"polyrob[{r.manifest.extra}]" in r.line(), r.line()
          print("bare install OK:", state.summary_line())
          PY
  prod-extras:
    # The set a production box installs (requirements.txt = the hashed closure
    # of PROD_EXTRAS, generated from the lock). `pip check` + the imports the
    # deploy's own import-test relies on, so PROD_EXTRAS drift is caught before
    # a deploy is. 058; 066 P1: hash-checked (prod is also wheel-only), then
    # the project itself --no-deps (pip's hash mode cannot hash a directory).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - run: pip install --require-hashes --prefer-binary -r requirements.txt
      - run: pip install --no-deps --no-build-isolation -e .
      - run: pip check
      - env: { POLYROB_DATA_DIR: /tmp/polyrob-ci }
        run: |
          python -c "import magic, pypdf, docx, imageio, qrcode, numpy; import api.upload_sniff, tools.document_parser, modules.cards.cards, surfaces.telegram.harness; print('prod extras OK')"
          python -c "from core.packs.loader import register_policies, load_packs; register_policies(); load_packs(); from core.packs import state; assert state.records() and all(r.status == state.LOADED and not r.needs for r in state.records()), [r.line() for r in state.records()]; print(state.summary_line())"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      # Run the gitleaks CLI directly instead of gitleaks-action@v2: the action
      # requires a paid GITLEAKS_LICENSE secret for organization-owned repos and
      # hard-fails without it. The CLI is MIT and license-free.
      - name: Run gitleaks (full history)
        run: |
          # OPS-19: checksum-verified (the release's own checksums.txt value for this file).
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          # Findings already in history (redacted, reviewed; the credentials are rotated
          # out of band) live in the private baseline; only a NEW leak fails the job.
          BASE=""; [ -f .gitleaks-baseline.json ] && BASE="--baseline-path .gitleaks-baseline.json"
          ./gitleaks git --no-banner --redact --config .gitleaks.toml $BASE \
            --report-format json --report-path /tmp/gitleaks.json . || {
            jq 'map({RuleID, File, StartLine, Commit})' /tmp/gitleaks.json
            exit 1
          }
  # NOTE: the bundled skills are validated by POLYROB's own strict validator
  # (agents/task/agent/skill_validation.py::validate_authored), exercised by
  # tests/unit/agents/task/test_library_invariants.py in the `test` job above — that
  # is what ships and gates boot/CLI/CI. A separate upstream `skills-ref` drift-oracle
  # job was removed: it required pinning an exact agentskills commit SHA and, unpinned,
  # reded the CI badge on every push for no runtime benefit. Re-add it (pinned to a
  # real SHA) only if cross-checking against the upstream reference rule set is needed.
