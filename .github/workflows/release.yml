name: Release

# Builds, validates, and publishes a POLYROB release, and defines "latest" for the
# `polyrob update --check` command. INERT until a version tag is pushed:
#
#   git tag -a vX.Y.Z -m "POLYROB vX.Y.Z" && git push origin vX.Y.Z
#
# One-time repo setup (Settings -> Secrets and variables -> Actions):
#   PYPI_API_TOKEN   PyPI project token (scope: polyrob). Omit to skip the PyPI
#                    publish step (the GitHub Release + built artifacts still work).
#
# The tag drives everything; `polyrob update` reads the GitHub Releases API and/or
# PyPI to discover the newest version, so cutting a tag here is what makes an update
# discoverable to users.

on:
  push:
    tags:
      - 'v*.*.*'

# Least privilege: the build runs read-only; only the publish job, which runs
# no project code, gets the write token that creates the GitHub Release.
permissions:
  contents: read

jobs:
  build:
    # Version tags also exist on the private development remote. Never build or
    # publish that tree: only the public repo is a release source.
    if: github.repository == 'theselfruleorg/polyrob'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG pkg=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match pyproject version $PKG"; exit 1
          fi

      - name: Build sdist + wheel
        run: |
          # Hash-pinned tooling AND build backend (--no-isolation builds with it).
          python -m pip install --require-hashes -r .github/release-requirements.txt
          python -m build --no-isolation
          twine check dist/*

      - name: Verify release artifact hygiene
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          leaked = []
          for artifact in Path("dist").iterdir():
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      names = archive.namelist()
              elif artifact.name.endswith(".tar.gz"):
                  with tarfile.open(artifact, "r:gz") as archive:
                      names = archive.getnames()
              else:
                  continue
              for name in names:
                  parts = name.split("/")
                  if "node_modules" in parts or "__pycache__" in parts or name.endswith((".pyc", ".pyo")):
                      leaked.append(f"{artifact.name}: {name}")
          if leaked:
              raise SystemExit("generated development files in release artifacts:\n" + "\n".join(leaked[:50]))
          PY

      - name: Upload the built artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      # Runs AFTER the upload: this step installs the wheel's dependencies
      # from PyPI unhashed, so nothing it runs can touch the published files.
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/relvenv
          /tmp/relvenv/bin/pip install "$(ls dist/*.whl)"
          smoke_dir="$(mktemp -d)"
          smoke_home="$(mktemp -d)"
          cd "$smoke_dir"
          HOME="$smoke_home" /tmp/relvenv/bin/polyrob version
          HOME="$smoke_home" /tmp/relvenv/bin/polyrob --help >/dev/null
          HOME="$smoke_home" /tmp/relvenv/bin/polyrob doctor >/dev/null
          test -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)"
          cd "$smoke_home"
          migration_rc=0
          POLYROB_DATA_DIR="$smoke_home/data" HOME="$smoke_home" \
            /tmp/relvenv/bin/python -m migrations.migrate status || migration_rc=$?
          test "$migration_rc" -eq 0 -o "$migration_rc" -eq 1

  publish:
    needs: build
    if: github.repository == 'theselfruleorg/polyrob'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release
    steps:
      - name: Checkout the pinned release tooling list only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/release-requirements.txt
          sparse-checkout-cone-mode: false

      - name: Download the built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          [ -n "$TWINE_PASSWORD" ] || exit 0
          python -m pip install --require-hashes -r .github/release-requirements.txt
          twine upload --non-interactive dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
