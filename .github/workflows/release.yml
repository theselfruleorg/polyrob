name: Release

# Builds, validates, and publishes a POLYROB release, and defines "latest" for the
# `polyrob update --check` command. INERT until a version tag is pushed:
#
#   git tag -a vX.Y.Z -m "POLYROB vX.Y.Z" && git push origin vX.Y.Z
#
# One-time repo setup (Settings -> Secrets and variables -> Actions):
#   PYPI_API_TOKEN   PyPI project token (scope: polyrob). Omit to skip the PyPI
#                    publish step (the GitHub Release + built artifacts still work).
#
# The tag drives everything; `polyrob update` reads the GitHub Releases API and/or
# PyPI to discover the newest version, so cutting a tag here is what makes an update
# discoverable to users.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write  # create the GitHub Release

jobs:
  release:
    # Version tags also exist on the private development remote. Never build or
    # publish that tree: only the public repo is a release source.
    if: github.repository == 'theselfruleorg/polyrob'
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches package version
        run: |
          python -m pip install --upgrade pip
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG pkg=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match pyproject version $PKG"; exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Verify release artifact hygiene
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          leaked = []
          for artifact in Path("dist").iterdir():
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      names = archive.namelist()
              elif artifact.name.endswith(".tar.gz"):
                  with tarfile.open(artifact, "r:gz") as archive:
                      names = archive.getnames()
              else:
                  continue
              for name in names:
                  parts = name.split("/")
                  if "node_modules" in parts or "__pycache__" in parts or name.endswith((".pyc", ".pyo")):
                      leaked.append(f"{artifact.name}: {name}")
          if leaked:
              raise SystemExit("generated development files in release artifacts:\n" + "\n".join(leaked[:50]))
          PY

      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/relvenv
          /tmp/relvenv/bin/pip install "$(ls dist/*.whl)"
          smoke_dir="$(mktemp -d)"
          smoke_home="$(mktemp -d)"
          cd "$smoke_dir"
          HOME="$smoke_home" /tmp/relvenv/bin/polyrob version
          HOME="$smoke_home" /tmp/relvenv/bin/polyrob --help >/dev/null
          HOME="$smoke_home" /tmp/relvenv/bin/polyrob doctor >/dev/null
          test -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)"
          cd "$smoke_home"
          migration_rc=0
          POLYROB_DATA_DIR="$smoke_home/data" HOME="$smoke_home" \
            /tmp/relvenv/bin/python -m migrations.migrate status || migration_rc=$?
          test "$migration_rc" -eq 0 -o "$migration_rc" -eq 1

      - name: Publish to PyPI
        if: ${{ env.PYPI_API_TOKEN != '' }}
        run: |
          twine upload --non-interactive -u __token__ -p "$PYPI_API_TOKEN" dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
