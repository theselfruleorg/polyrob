# gitleaks config — extends the default ruleset with allowlist entries for
# known-benign matches. Used by scripts/scrub_gate.sh and public CI alike.
# POLICY: only add an entry here for (a) vendored minified libs, (b) obviously
# fake test fixtures, (c) public on-chain addresses. NEVER for a real credential.

[extend]
useDefault = true

[allowlist]
description = "Known-benign matches"
paths = [
    # vendored minified library — hash-like strings are code, not secrets
    '''webview/static/js/ethers\.min\.js''',
    # credential-scrubbing tests: their whole point is to contain fake keys
    '''tests/unit/cli/ui/test_scrubber\.py''',
    '''tests/unit/cli/ui/test_command_emit_scrub\.py''',
    '''tests/unit/tools/hf_deploy/test_broker\.py''',
    '''tests/unit/core/test_prefs_check\.py''',
    '''tests/unit/core/test_prefs_schema\.py''',
    '''tests/unit/cli/ui/test_nested_arg_scrub\.py''',
    '''tests/unit/cli/ui/test_tool_transparency\.py''',
    '''tests/unit/cli/test_quick_key_setup\.py''',
    '''tests/unit/core/test_credential_scrub\.py''',
    '''tests/unit/core/test_env_key_backfill\.py''',
    '''tests/unit/core/test_redaction_predicate\.py''',
    '''tests/config/test_agent_server_config_split\.py''',
    '''tests/unit/core/test_security_logging_filter\.py''',
    '''tests/unit/surfaces/test_error_notices\.py''',
    '''tests/unit/tools/oauth/test_oauth_manager\.py''',
    # the shared secret-scrub battery test: one sample per rung (pem/bearer/kv/
    # provider/rob/aws/jwt) is exactly what it exists to contain
    '''tests/unit/core/test_shared_credential_patterns\.py''',
    # 0.11.0 wave — credential-flow tests whose fixtures are 0123456789-filler
    # keys by construction (verified line-by-line at the 0.11.0 scrub gate)
    '''tests/unit/cli/test_config_cmd\.py''',
    '''tests/unit/cli/test_auth_add_key\.py''',
    '''tests/unit/cli/test_doctor_provenance\.py''',
    '''tests/unit/cli/test_connect_discovery\.py''',
    '''tests/unit/cli/test_provider_surfaces_ux\.py''',
    '''tests/unit/modules/llm/test_subscription_providers\.py''',
    # OAuth error-body scrub test: contains gitleaks' own documentation example
    # token (gho_16C7e42…) precisely to assert it gets REDACTED
    '''tests/unit/core/llm_auth/test_oauth_flows\.py''',
]
regexes = [
    # public on-chain token contract addresses (public by definition, not secrets)
    '''0xb0d79432bb6d163d3832157cff61a918d38aab81''',
    # mainnet USDC token contract (defi guard tests)
    '''0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48''',
    # documented example API key placeholder in docstrings
    '''rob_abc123\.\.\.''',
    # a Python identifier, not a credential: the shared ERC-20 ABI fragment
    # constant. `from ... import TOKEN_ADDRESSES, ERC20_BALANCEOF_ABI` reads to
    # generic-api-key as key,secret.
    '''ERC20_BALANCEOF_ABI''',
    # synthetic z.ai key used across the provider-registry/UX suites (literal
    # 0123456789abcdef filler — never a real credential)
    '''zk-0123456789abcdef0123456789''',
    # synthetic JWT in the credential-layer agent-unreachability test; decodes to
    # {"sub":"rob","exp":1} with the literal text "signature-segment"
    '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJyb2IiLCJleHAiOjF9\.c2lnbmF0dXJlLXNlZ21lbnQ''',
]
