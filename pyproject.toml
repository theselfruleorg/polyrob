[build-system]
requires = ["setuptools>=83.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyrob"
version = "1.0.3"
description = "POLYROB — autonomous AI agent framework"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "The POLYROB Authors" }]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.0.0", "pydantic-settings>=2.0.0", "python-dotenv>=1.0.0",
  "openai>=1.26.0", "anthropic>=0.20.0", "google-generativeai>=0.8.0",
  "tiktoken>=0.7.0", "aiohttp>=3.14.3", "aiofiles>=23.0.0", "aiosqlite>=0.19.0",
  "requests>=2.30.0", "certifi>=2024.0.0", "cryptography>=50.0.0", "pyjwt>=2.8.0",
  "numpy>=1.24.0", "pandas>=2.0.0",
  "apsw>=3.46", "sqlite-vec>=0.1.6",
  "rich>=13.0.0", "prompt_toolkit>=3.0.43", "click>=8.0", "colorama>=0.4.6",
  "python-docx>=0.8.0", "pypdf>=6.16.1", "markdown>=3.5.0", "markdownify>=0.11.0",
  "pillow>=12.3.0", "imageio>=2.37.0", "python-magic>=0.4.27", "qrcode>=7.4",
  # Security floors for transitive parsers/HTTP clients; see the system security review.
  "httplib2>=0.32.0", "pyasn1>=0.6.4",
  "anysite-cli>=0.3", "pyyaml>=6", "packaging>=23.2", "h2>=4.4.1",
]

[project.optional-dependencies]
server = ["fastapi==0.141.1", "starlette==1.6.0", "uvicorn[standard]==0.38.0", "Jinja2==3.1.6", "python-socketio>=5.11.0", "python-multipart>=0.0.6", "watchfiles>=1.0.0", "argon2-cffi>=23.1.0"]
browser = ["playwright>=1.40.0"]
memory-vector = ["sentence-transformers>=3.0.0"]
crypto = ["web3>=6.0.0", "eth-account>=0.10.0", "x402>=2.13.0", "fastapi-x402>=0.1.8", "hyperliquid-python-sdk>=0.21.0", "py-clob-client-v2>=0.1.0"]
# Solana is its own extra, not part of `crypto`: it is a second curve and a
# second transaction model, and a deployment that only trades EVM should not
# carry a Rust-backed dependency it never imports.
# ⚠️ `solana` is UPPER-bounded on purpose. The x402 SDK's SVM mechanism imports
# `from solana.rpc.api import Client` — the SYNCHRONOUS client, which solana-py
# DELETED in 0.40.0 (0.40 ships only `rpc/async_api.py`). An unbounded install
# resolves to a version where the SDK's own module cannot import, and the
# failure surfaces as a confusing "install x402[svm]" error when x402[svm] is
# already installed. Our OWN Solana code needs only `solders` and is unaffected.
# The bound is `<0.40`, NOT `<0.36`: `solana/rpc/api.py` is verified present in
# 0.36.6, 0.36.12, 0.37.1, 0.38.0 and 0.39.0, and absent from 0.40.0 onward.
# `<0.36` was also UNSATISFIABLE — every published x402 declares
# `solana>=0.36.0` under its `svm` extra, so the pair had no solution and pip
# backtracked through the whole x402 range into a cytoolz sdist that fails to
# Cythonize on current toolchains (public CI, 0.13.0).
solana = ["solders>=0.21", "x402[svm]>=2.16.0", "solana>=0.36,<0.40", "httpx2>=2.12.0", "httpcore2>=2.10.0"]
telegram = ["aiogram>=3.17.0"]
twitter = ["tweepy>=4.14.0", "chatxdk>=0.5.0"]
voice = ["faster-whisper>=1.0.0"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.6", "build", "twine"]
all = ["polyrob[server,browser,memory-vector,crypto,solana,telegram,twitter,voice]"]

[project.urls]
Homepage = "https://github.com/theselfruleorg/polyrob"
Repository = "https://github.com/theselfruleorg/polyrob"
Issues = "https://github.com/theselfruleorg/polyrob/issues"

[project.scripts]
polyrob = "cli.polyrob:main"

[tool.setuptools.packages.find]
include = ["cli*","core*","agents*","modules*","tools*","api*","utils*","cron*","surfaces*","webview*","avatar*","datagen*","data","assets*","migrations*"]
exclude = ["*.node_modules", "*.node_modules.*", "*.__pycache__", "*.__pycache__.*"]

[tool.setuptools.package-data]
"*" = ["*.json","*.txt","*.md"]
# data/characters carries the curated use-case personas (researcher/coder/
# analyst/writer/ops) that tier 3 of persona_resolver.character_search_dirs()
# serves; the "*" glob above is NOT recursive, so a subdirectory needs its own
# entry or every pip install gets exactly one character (F12, 0.13.0).
"data" = ["prompts/**/*.json", "prompts/**/*.md", "prompts/**/*",
          "characters/*.json"]
# Webgate dev-tree assets (doc 03, P4). Ship the raw static/ + templates/ so an
# installed wheel can serve the webgate from the package when no built web_dist
# bundle is present. core/assets.py::webgate_asset_dir() prefers web_dist, then
# falls back to these.
"webview" = ["static/**/*", "templates/**/*"]
# 042: the token template's Solidity source ships beside its compiled bytes.
# `core/wallet/token_template.py` tells the reader "the source lives beside this
# file"; the "*" glob above is not recursive and does not carry .sol, so without
# this the claim is false in an installed wheel.
"core" = ["wallet/contracts/*.sol"]
# 043 A14(S): tools/dom/service.py reads buildDomTree.js by path at runtime
# (browser-side DOM extraction script); the "*" glob above does not carry
# .js, so without this the installed wheel silently fell back to a broken
# minimal DOM-tree builder.
"tools" = ["dom/*.js"]
# Avatar engine + brand/render assets (mindprint.js, studio.html, config/rob.json,
# renders/rob.png, webview/avatar-live.js) — the renderer/store/webview read these by
# path, so they MUST ship in the wheel (mirrors the webview asset handling above).
"avatar" = ["**/*.js", "**/*.html", "**/*.json", "**/*.png"]
# Built webgate bundle (produced by doc 03). Matches nothing until the bundle is
# built, so it's inert today — no behavior change. core/assets.py resolves it.
"polyrob" = ["web_dist/**/*"]
# Bundled fonts (DejaVu, permissive Bitstream Vera license) — modules/pfp/cards.py
# reads assets/fonts/dejavu/*.ttf by path at runtime to render invoice/PFP cards
# in Pillow (no headless browser). Without this the wheel omits them and card
# rendering silently degrades to PIL's default font. Ship the TTFs + LICENSE.
"assets" = ["fonts/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
