[pytest]
# A bare `pytest` collects these roots. ops/tests holds the tests of operator
# tooling (scripts/, deployment/) and exists only in the private tree.
testpaths = tests ops/tests
# norecursedirs matches a directory BASENAME anywhere, so never list a name a
# test directory could carry (`scripts` here once dropped tests/unit/scripts).
# The repo-root scripts/ live-key runners are ignored by the root conftest.py.
norecursedirs = .git .* build dist *.egg venv node_modules data

markers =
    integration: integration tests (may need external services)
    live(tier): proves a shipped feature against prod (ops/tests/live, POLYROB_LIVE_PROOF=1); tier L0 read-only · L1 harmless side effect · L2 money within caps. Outside ops/tests/live: tests that require live API keys
    asyncio: mark a test as async (registered for pytest-asyncio compatibility)
    slow: tests that spawn a real subprocess / are otherwise too slow for the fast inner loop
